name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: UI npm ci + build
        run: |
          npm ci
          npm run build:ui

      - name: Sidecar npm ci
        working-directory: sidecar
        run: npm ci --ignore-scripts

      - name: Sidecar bun compile (linux)
        run: bun scripts/build-sidecar.mjs linux

      - name: Stub Windows sidecar for resource path check
        run: |
          # tauri.conf.json requires both sidecar paths to exist for cargo check
          if [ ! -f build/jsra-sidecar.exe ]; then
            printf 'stub\n' > build/jsra-sidecar.exe
          fi

      - name: cargo check
        working-directory: src-tauri
        run: cargo check
